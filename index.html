<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EDU-BOARD | Fool-Proof Starter Kit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { navy: { DEFAULT: '#0B1F3A', 700: '#12305A', 500: '#1D4780' }, safe: { DEFAULT: '#16C47F', dark: '#0E9A62', soft: '#E7F9F0' } }, fontFamily: { sans: ['Inter', 'system-ui', 'Segoe UI', 'Arial', 'sans-serif'] } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
      --navy: #0B1F3A;
      --safe: #16C47F;
      --red: #EF4444;
      --amber: #F2B84B;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      background: #F5F8FB;
      color: #0B1F3A;
      font-family: Inter, system-ui, 'Segoe UI', Arial, sans-serif
    }

    .grid-bg {
      background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
      background-size: 32px 32px
    }

    /* 3D Simulation Overlay & UI styles */
    .sim-lab {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
      background: rgba(11, 31, 58, .88);
      border: 1px solid rgba(255, 255, 255, .2);
      padding: 3px 8px;
      border-radius: 99px;
      color: #fff;
      will-change: transform;
    }
    .sim-lab.g { border-color: var(--safe); color: var(--safe); }
    .sim-lab.r { border-color: var(--red); color: #FCA5A5; }

    #st.scan { border-left-color: var(--amber) !important; }
    #st.scan b { color: var(--amber) !important; }
    #st.ok { border-left-color: var(--safe) !important; }
    #st.ok b { color: var(--safe) !important; }
    #st.short { border-left-color: var(--red) !important; }
    #st.short b { color: var(--red) !important; }

    /* EDU-BOARD 3D Packaging Box Styles */
    :root {
      --box-w: 300px;
      --box-d: 68px;
      --box-h: 224px;
    }

    @keyframes introScaleUp {
      0% {
        opacity: 0;
        transform: translateY(70px) scale(0.65);
      }
      60% {
        opacity: 1;
        transform: translateY(-8px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hero-3d-wrap {
      animation: introScaleUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      perspective: 1400px;
    }

    .box-stage {
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      position: relative;
      user-select: none;
      perspective: 1400px;
    }
    .box-stage:active { cursor: grabbing; }

    .box-world {
      transform: scale(var(--s, 1));
      transform-style: preserve-3d;
      will-change: transform;
    }

    .box-cube {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .box-cube.anim { transition: transform .8s cubic-bezier(.3,.7,.2,1); }

    .box-shadow {
      position: absolute;
      bottom: 22px;
      left: 50%;
      width: 320px;
      height: 44px;
      margin-left: -160px;
      background: radial-gradient(closest-side, rgba(0,0,0,0.55), rgba(22, 196, 127, 0.15), transparent);
      filter: blur(8px);
      pointer-events: none;
      transform: scale(var(--s, 1));
    }

    .box-f {
      position: absolute;
      left: 50%;
      top: 50%;
      overflow: hidden;
      background: #f6f7f8;
      color: #1c2b39;
      backface-visibility: hidden;
      font-family: Inter, system-ui, Arial, sans-serif;
      box-shadow: inset 0 0 1px rgba(0,0,0,0.25);
    }

    .box-f.fr, .box-f.bk {
      width: var(--box-w);
      height: var(--box-h);
      margin: calc(var(--box-h)/-2) 0 0 calc(var(--box-w)/-2);
    }
    .box-f.fr { transform: translateZ(calc(var(--box-d)/2)); }
    .box-f.bk { transform: rotateY(180deg) translateZ(calc(var(--box-d)/2)); }

    .box-f.rt, .box-f.lf {
      width: var(--box-d);
      height: var(--box-h);
      margin: calc(var(--box-h)/-2) 0 0 calc(var(--box-d)/-2);
    }
    .box-f.rt { transform: rotateY(90deg) translateZ(calc(var(--box-w)/2)); background: #eef0f2; }
    .box-f.lf { transform: rotateY(-90deg) translateZ(calc(var(--box-w)/2)); background: #e9ecef; }

    .box-f.tp, .box-f.bt {
      width: var(--box-w);
      height: var(--box-d);
      margin: calc(var(--box-d)/-2) 0 0 calc(var(--box-w)/-2);
    }
    .box-f.tp { transform: rotateX(90deg) translateZ(calc(var(--box-h)/2)); background: #fafbfb; }
    .box-f.bt { transform: rotateX(-90deg) translateZ(calc(var(--box-h)/2)); background: #d9dde1; }

    .box-f img.bs { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }

    .box-side {
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: 100%;
      align-items: center;
      text-align: center;
      background: #eef0f2;
    }
    .box-side div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .box-side svg { width: 22px; height: 22px; stroke: #1c2b39; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .box-side b { font-size: 6px; line-height: 1.15; letter-spacing: .1px; font-weight: 800; color: #1c2b39; }
    .box-side em { font-size: 5.5px; font-style: normal; color: #4a5865; }

    .box-vert { display: flex; align-items: center; justify-content: center; height: 100%; }
    .box-vert h3 { margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); font: 900 18px "Arial Black", Arial, sans-serif; letter-spacing: 1px; white-space: nowrap; color: #1c2b39; }

    .box-top-in { display: flex; align-items: center; justify-content: center; flex-direction: column; height: 100%; }
    .box-top-in h2 { margin: 0; font: 900 22px/1 "Arial Black", Arial, sans-serif; letter-spacing: -1px; color: #1c2b39; }
    .box-top-in small { font-size: 6.5px; font-weight: 800; margin-top: 3px; color: #33414e; }

    .box-bt-in { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 8px; font-weight: 700; color: #4a5865; gap: 8px; }

    /* Cahaya Atas & Bawah */
    .glow-light-top {
      position: absolute;
      top: -24px;
      left: 10%;
      right: 10%;
      height: 90px;
      background: radial-gradient(ellipse at center, rgba(22, 196, 127, 0.45) 0%, rgba(29, 71, 128, 0.2) 50%, transparent 75%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 1;
    }

    .glow-light-bottom {
      position: absolute;
      bottom: -15px;
      left: 5%;
      right: 5%;
      height: 110px;
      background: radial-gradient(ellipse at center, rgba(22, 196, 127, 0.5) 0%, rgba(14, 154, 98, 0.25) 45%, transparent 70%);
      filter: blur(24px);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    const { useState, useEffect, useRef } = React;
    const html = htm.bind(React.createElement);

    /* GAMBAR PRODUK & 3D BOX: isi dengan path atau URL file gambar Anda. */
    const IMAGES = {
      hero: '',
      boxFront: 'src/depan.png', // Mengarah ke file di folder src/
      boxBack: 'src/depan.png',  // Mengarah ke file di folder src/
      flatlay: 'src/fotoproduk.png',
      modul: 'src/self.png',
      jst: 'src/jst.png',
      guidebook: 'src/books.png',
      qr: ''
    };
    const Slot = ({ k, label, hint }) => IMAGES[k]
      ? html`<img src=${IMAGES[k]} alt=${label} className="w-full h-full object-cover rounded-2xl"/>`
      : html`<div className="w-full h-full rounded-2xl border-2 border-dashed border-safe/50 bg-gradient-to-br from-safe-soft to-white flex flex-col items-center justify-center text-center p-4"><div className="w-12 h-12 rounded-xl bg-safe/20 text-safe-dark flex items-center justify-center"><${Icon} n="image" size=${24}/></div><div className="mt-3 font-semibold text-navy text-sm">${label}</div><div className="text-xs text-slate-500 mt-1">${hint}</div></div>`;

    /* Ikon: path Lucide (inline, tanpa dependensi) */
    const P = {
      plug: ["M12 22v-5", "M9 8V2", "M15 8V2", "M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"],
      shield: ["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z", "m9 12 2 2 4-4"],
      book: ["M12 7v14", "M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"],
      check: ["M20 6 9 17l-5-5"],
      zap: ["M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"],
      warn: ["m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3", "M12 9v4", "M12 17h.01"],
      image: ["M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z", "M9 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z", "m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"],
      scan: ["M3 7V5a2 2 0 0 1 2-2h2", "M17 3h2a2 2 0 0 1 2 2v2", "M21 17v2a2 2 0 0 1-2 2h-2", "M7 21H5a2 2 0 0 1-2-2v-2", "M7 12h10"],
      cube: ["M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z", "m3.27 6.96 8.73 5.04 8.73-5.04", "M12 22.08V12"],
      close: ["M18 6 6 18", "m6 6 12 12"]
    };
    const Icon = ({ n, size = 24, className = '' }) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className=${className}>${P[n].map((d, i) => html`<path key=${i} d=${d}/>`)}</svg>`;

    const Led = ({ on, color }) => html`<span className=${'inline-block w-6 h-6 rounded-full transition-all duration-300 ' + (on ? '' : 'bg-slate-600')} style=${on ? { background: color, boxShadow: '0 0 22px 6px ' + color } : {}}></span>`;

    function Nav({ onOpenModal, onOpenConnectorModal }) {
      return html`<header className="absolute top-0 inset-x-0 z-10"><div className="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between">
  <div className="flex items-center gap-2 text-white font-extrabold text-lg"><span className="w-8 h-8 rounded-lg bg-safe flex items-center justify-center text-navy"><${Icon} n="zap" size=${18}/></span>EDU-BOARD</div>
  <nav className="hidden sm:flex items-center gap-5 text-sm text-slate-300">
    <button onClick=${onOpenModal} className="text-safe font-semibold hover:text-white flex items-center gap-1.5 transition" title="Simulasi 3D Self-Diagnose"><${Icon} n="cube" size=${16}/>Demo Self-Diagnose</button>
    <button onClick=${onOpenConnectorModal} className="text-cyan-400 font-semibold hover:text-white flex items-center gap-1.5 transition" title="Simulasi 3D Konektor Fool-Proof"><${Icon} n="plug" size=${16}/>Demo Konektor</button>
    <a href="#fitur" className="hover:text-white transition">Keunggulan</a>
    <a href="#cara" className="hover:text-white transition">Cara Kerja</a>
    <a href="#guidebook" className="hover:text-white transition">Guidebook</a>
    <a href="#harga" className="hover:text-white transition">Harga</a>
  </nav>
 </div></header>`;
    }

    /* Komponen Kemasan EDU-BOARD 3D dengan Efek Cahaya, Animasi Scale-Up, & Auto-Rotate */
    function Hero3DBox({ onOpenModal, onOpenConnectorModal }) {
      const stageRef = useRef(null);
      const boxRef = useRef(null);
      const worldRef = useRef(null);
      const [autoRotate, setAutoRotate] = useState(true);

      useEffect(() => {
        const stage = stageRef.current;
        const box = boxRef.current;
        const world = worldRef.current;
        if (!stage || !box || !world) return;

        let rx = -16, ry = -28, zoom = 1, drag = false, lx = 0, ly = 0, animTimer = null;
        let isAuto = autoRotate;

        function fit() {
          const w = stage.clientWidth || 360;
          const s = Math.min(1.15, (w - 20) / 340) * zoom;
          world.style.setProperty('--s', s.toFixed(3));
          const shadow = stage.querySelector('.box-shadow');
          if (shadow) shadow.style.setProperty('--s', s.toFixed(3));
        }

        function apply() {
          box.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
        }

        const onDown = e => {
          drag = true;
          box.classList.remove('anim');
          lx = e.clientX;
          ly = e.clientY;
          if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
        };

        const onMove = e => {
          if (!drag) return;
          ry += (e.clientX - lx) * 0.55;
          rx = Math.max(-90, Math.min(90, rx - (e.clientY - ly) * 0.55));
          lx = e.clientX;
          ly = e.clientY;
          apply();
        };

        const onUp = () => { drag = false; };

        stage.addEventListener('pointerdown', onDown);
        stage.addEventListener('pointermove', onMove);
        stage.addEventListener('pointerup', onUp);
        stage.addEventListener('pointercancel', onUp);

        let reqId;
        function loop() {
          if (isAuto && !drag) {
            box.classList.remove('anim');
            ry += 0.45;
            apply();
          }
          reqId = requestAnimationFrame(loop);
        }
        loop();

        window.addEventListener('resize', fit);
        fit();
        apply();

        return () => {
          cancelAnimationFrame(reqId);
          window.removeEventListener('resize', fit);
          stage.removeEventListener('pointerdown', onDown);
          stage.removeEventListener('pointermove', onMove);
          stage.removeEventListener('pointerup', onUp);
          stage.removeEventListener('pointercancel', onUp);
          clearTimeout(animTimer);
        };
      }, [autoRotate]);

      const rotateToFace = (x, y) => {
        const box = boxRef.current;
        if (!box) return;
        box.classList.add('anim');
        box.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
        setTimeout(() => box.classList.remove('anim'), 900);
      };

      const sideContent = html`
        <div className="box-side">
          <div>
            <${Icon} n="shield" size=${20} className="text-navy"/>
            <b>SELF-DIAGNOSE</b>
            <em>Aman dari Korslet</em>
          </div>
          <div>
            <${Icon} n="plug" size=${20} className="text-navy"/>
            <b>FOOL-PROOF</b>
            <em>Anti Terbalik</em>
          </div>
          <div>
            <${Icon} n="book" size=${20} className="text-navy"/>
            <b>HYBRID GUIDEBOOK</b>
            <em>Cepat & Mandiri</em>
          </div>
        </div>
      `;

      return html`
        <div className="relative hero-3d-wrap rounded-3xl bg-navy-700/80 border border-white/15 p-4 sm:p-6 shadow-2xl backdrop-blur-md">
          
          <!-- Efek Cahaya / Glow atas -->
          <div className="glow-light-top"></div>

          <!-- Header info card -->
          <div className="relative z-10 flex justify-between items-center mb-2">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-safe animate-ping"></span>
              <span className="text-xs font-bold text-safe tracking-wide font-mono">EDU-BOARD 3D STARTER PACK</span>
            </div>
            <div className="flex items-center gap-2">
              <button 
                onClick=${() => setAutoRotate(!autoRotate)} 
                className=${'text-[11px] font-semibold px-2.5 py-1 rounded-full border transition ' + (autoRotate ? 'bg-safe/20 border-safe text-safe' : 'bg-white/10 border-white/20 text-slate-300')}
                title="Toggle Putar Otomatis">
                ${autoRotate ? 'Auto-Rotate ON' : 'Paused'}
              </button>
            </div>
          </div>

          <!-- Stage 3D Box -->
          <div className="relative z-10 box-stage" ref=${stageRef}>
            <div className="box-shadow"></div>
            <div className="box-world" ref=${worldRef}>
              <div className="box-cube" ref=${boxRef}>
                <!-- Sisi Depan -->
                <div className="box-f fr">
                  ${IMAGES.boxFront ? html`
                    <img src=${IMAGES.boxFront} alt="Kemasan Depan" className="bs w-full h-full object-cover"/>
                  ` : html`
                    <!-- Desain default (akan otomatis digantikan saat IMAGES.boxFront diisi) -->
                    <div className="absolute top-2.5 right-3 font-extrabold text-[12px] text-navy tracking-tight flex items-center gap-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-red-600 inline-block"></span> UPI
                    </div>
                    <div className="absolute left-3.5 top-3.5 text-left w-44">
                      <h2 className="m-0 text-navy font-black text-xl leading-tight">EDU-BOARD</h2>
                      <small className="block text-[6.5px] font-bold text-slate-600 tracking-wider mt-0.5">PAKET PRAKTIKUM ELEKTRONIKA DASAR</small>
                      <strong className="block text-[8.5px] font-bold text-slate-800 leading-snug mt-1.5">Belajar Elektronika Lebih Aman, Tanpa Takut Komponen Rusak!</strong>
                      <span className="block text-[6.2px] text-slate-600 mt-1 leading-tight">Berbasis Plug-and-Play dengan Proteksi Self-Diagnose</span>
                    </div>
                    <div className="absolute left-0 bottom-2.5 bg-navy text-white font-extrabold text-[7.5px] px-3 py-1 rounded-r-md">
                      BASIC STARTER PACK
                    </div>
                    <div className="absolute right-3 bottom-3 w-32 h-20 bg-gradient-to-br from-slate-100 to-slate-200 border border-slate-300 rounded-lg p-2 shadow-inner flex flex-col justify-between">
                      <div className="flex justify-between items-center">
                        <span className="text-[7px] font-bold text-slate-600">MODUL V1</span>
                        <div className="flex gap-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-red-500 shadow-sm shadow-red-500"></span>
                          <span className="w-1.5 h-1.5 rounded-full bg-safe shadow-sm shadow-safe"></span>
                        </div>
                      </div>
                      <div className="grid grid-cols-5 gap-1 my-1">
                        ${Array.from({ length: 10 }).map((_, i) => html`<div key=${i} className="h-1.5 rounded-sm bg-safe/60"></div>`)}
                      </div>
                      <div className="text-[6px] text-slate-500 font-mono text-center">JST FOOL-PROOF</div>
                    </div>
                  `}
                </div>

                <!-- Sisi Belakang -->
                <div className=${'box-f bk ' + (IMAGES.boxBack ? '' : 'bg-slate-100 p-3 flex flex-col justify-between text-left')}>
                  ${IMAGES.boxBack ? html`
                    <img src=${IMAGES.boxBack} alt="Kemasan Belakang" className="bs w-full h-full object-cover"/>
                  ` : html`
                    <!-- Desain default (akan otomatis digantikan saat IMAGES.boxBack diisi) -->
                    <div className="flex justify-between items-center border-b border-slate-300 pb-1.5">
                      <span className="text-[9px] font-bold text-navy">SPESIFIKASI & FITUR</span>
                      <span className="text-[7px] font-mono text-slate-500">REV 1.0</span>
                    </div>
                    <ul className="text-[6.8px] text-slate-700 space-y-1 list-disc pl-3">
                      <li>Modul Proteksi PTC Resettable Fuse 500mA</li>
                      <li>Tombol Pre-Flight Check dengan Dual LED</li>
                      <li>Soket JST Anti-Reverse Polarity</li>
                      <li>Hybrid Guidebook Cetak + QR Video</li>
                    </ul>
                    <div className="flex items-center justify-between pt-1 border-t border-slate-300 text-[6.5px] text-slate-500">
                      <span>Tim Technopreneurship UPI</span>
                      <span className="font-bold text-navy">edu-board.id</span>
                    </div>
                  `}
                </div>

                <!-- Sisi Kanan -->
                <div className="box-f rt">${sideContent}</div>

                <!-- Sisi Kiri -->
                <div className="box-f lf">
                  <div className="box-vert">
                    <h3>EDU-BOARD</h3>
                  </div>
                </div>

                <!-- Sisi Atas -->
                <div className="box-f tp">
                  <div className="box-top-in">
                    <h2>EDU-BOARD</h2>
                    <small>PAKET PRAKTIKUM ELEKTRONIKA DASAR</small>
                  </div>
                </div>

                <!-- Sisi Bawah -->
                <div className="box-f bt">
                  <div className="box-bt-in">
                    <b>UPI</b>
                    <span>BASIC STARTER PACK</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Efek Cahaya / Glow bawah -->
          <div className="glow-light-bottom"></div>

          <!-- Quick Navigation Sisi Box & Aksi -->

    /* Modal Simulasi 3D Self-Diagnose (diadaptasi langsung dari edu.html) */
    function SimulationModal({ isOpen, onClose }) {
      const mountRef = useRef(null);

      useEffect(() => {
        if (!isOpen || !mountRef.current) return;

        const container = mountRef.current;
        const labelsContainer = container.querySelector('#sim-labels-layer');
        const stEl = container.querySelector('#st');
        const curEl = container.querySelector('#cur');
        const goBtn = container.querySelector('#go');
        const rotBtn = container.querySelector('#rot');
        const resetBtn = container.querySelector('#reset');
        const segBtns = container.querySelectorAll('.seg-btn');

        const W = () => container.clientWidth || window.innerWidth;
        const H = () => container.clientHeight || window.innerHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0B1F3A);
        scene.fog = new THREE.Fog(0x0B1F3A, 20, 45);

        const cam = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 100);
        cam.position.set(9, 8, 11).multiplyScalar(W() / H() < 0.8 ? 1.7 : 1);

        const ren = new THREE.WebGLRenderer({ antialias: true });
        ren.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        ren.setSize(W(), H());

        const dom = ren.domElement;
        dom.style.cssText = 'position:absolute;inset:0;touch-action:none;cursor:grab;width:100%;height:100%;';
        container.insertBefore(dom, container.firstChild);

        const ctl = new THREE.OrbitControls(cam, dom);
        ctl.enableDamping = true;
        ctl.autoRotate = true;
        ctl.autoRotateSpeed = 0.7;
        ctl.maxPolarAngle = Math.PI * 0.48;
        ctl.minDistance = 6;
        ctl.maxDistance = 26;
        ctl.target.set(0, 0.3, 0);

        scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x0b1f3a, 0.95));
        const dl = new THREE.DirectionalLight(0xffffff, 0.9);
        dl.position.set(6, 10, 6);
        scene.add(dl);

        const pl = (c, x, y, z) => {
          const l = new THREE.PointLight(c, 0, 5);
          l.position.set(x, y, z);
          scene.add(l);
          return l;
        };
        const gL = pl(0x16C47F, 1.9, 1, -1.4), rL = pl(0xEF4444, 1.9, 1, 1.4), spL = pl(0xFFB84D, 5.6, 1.2, 0);

        const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.5, metalness: 0.1 }, o));
        const add = (g, m, x, y, z) => {
          const o = new THREE.Mesh(g, m);
          o.position.set(x, y, z);
          scene.add(o);
          return o;
        };
        const Bx = (a, b, c) => new THREE.BoxGeometry(a, b, c), Cy = (r, h) => new THREE.CylinderGeometry(r, r, h, 20);

        /* Papan & Modul */
        add(Bx(15, 0.3, 8), M(0x12305A), 0, -0.15, 0);
        add(Bx(5.6, 0.12, 4.8), M(0x0E6B4C, { roughness: 0.7 }), 0.3, 0.06, 0);

        /* Sumber daya + konektor JST asimetris */
        add(Bx(1.6, 0.9, 1.6), M(0x1D4780), -6, 0.45, 0);
        add(Bx(0.5, 0.35, 0.9), M(0xEEF2F6), -5.05, 0.45, 0);
        add(Bx(0.5, 0.14, 0.3), M(0xEEF2F6), -5.05, 0.69, 0.6);

        /* PTC fuse */
        const fuseMat = M(0xF2A93B, { roughness: 0.4 }), fuseBase = new THREE.Color(0xF2A93B), fuseHot = new THREE.Color(0xB91C1C);
        add(Bx(1.3, 0.5, 0.9), fuseMat, -1.6, 0.37, 0);

        /* Kabel */
        const wA = M(0x6B7A90, { roughness: 0.3 }), wB = M(0x6B7A90, { roughness: 0.3 });
        const wire = (x1, x2, m) => {
          const o = add(Cy(0.08, x2 - x1), m, (x1 + x2) / 2, 0.45, 0);
          o.rotation.z = Math.PI / 2;
        };
        wire(-4.8, -2.25, wA);
        wire(-0.95, 5.1, wB);

        /* Tombol Pre-Flight */
        const btnBase = add(Cy(0.6, 0.2), M(0x222B3A), -0.2, 0.2, 1.5);
        const cap = add(Cy(0.36, 0.3), M(0xE5E7EB), -0.2, 0.45, 1.5);

        const xs = -4.8, xe = 5.1, xf = -2.25, N = 14;

        const lFuse = createLab('PTC Resettable Fuse', -1.6, 1.1, 0);

        createLab('LED Merah · Korsleting', 1.9, 1.1, 1.4, 'r');
        const lLoad = createLab('Rangkaian Anda', 6, 1.5, 0);

        /* State simulasi */
        let phase = 'idle', scen = 'ok', t0 = 0, gI = 0, rI = 0, lI = 0, heat = 0, cur = 0, capY = 0.45;
        const clock = new THREE.Clock();
        const TXT = {
          idle: ['Siap', 'Pilih skenario, lalu tekan Pre-Flight Check.', ''],
          scan: ['Mendeteksi Rangkaian...', 'Modul menguji rangkaian dengan arus kecil.', 'scan'],
          ok: ['Lampu Hijau: Wiring Aman, Daya Dialirkan', 'Tidak ada korsleting. Arus mengalir ke rangkaian.', 'ok'],

        function updateUI() {

          stEl.className = 'min-h-[66px] rounded-xl bg-black/40 p-3 border-l-4 border-slate-500 ' + c;
          stEl.querySelector('b').textContent = a;
          stEl.querySelector('span').textContent = b;
          goBtn.disabled = phase === 'scan';
          segBtns.forEach(btn => {
            if (btn.dataset.s === scen) {
              btn.className = 'seg-btn flex-1 py-2 px-3 rounded-lg text-xs font-bold bg-white text-navy transition';
            } else {
              btn.className = 'seg-btn flex-1 py-2 px-3 rounded-lg text-xs font-bold bg-white/10 text-white hover:bg-white/20 transition';

        }

        function runScan() {
          if (phase === 'scan') return;

        function pickScen(s) {

        [[20, 40, 200, 40], [200, 40, 240, 80], [300, 60, 480, 60], [60, 120, 60, 260], [420, 100, 420, 250], [100, 300, 260, 300]].forEach(l => {
          cx.beginPath(); cx.moveTo(l[0], l[1]); cx.lineTo(l[2], l[3]); cx.stroke();

        cx.fillText('EDU-BOARD', 30, 335);
        cx.font = '20px sans-serif';
        cx.fillText('J1  JST-XH 4P', 300, 335);
        const pm0 = M(0x155c38, { roughness: 0.7 });
        box(10, 0.4, 7.4, [pm0, pm0, new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(cv), roughness: 0.6 }), pm0, pm0, pm0], 1.2, -1.7, 0);
        box(1.6, 0.3, 1.1, M(0x15171c), -2.4, -1.35, -2.4);

        const capMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.8, 20), M(0x2b4fa8));

        // Soket betina
        const sg = new THREE.Group();

   <h2 className="text-3xl sm:text-4xl font-extrabold text-navy">Harga yang Berpihak pada Pemula</h2>

   <div className="mt-10 mx-auto max-w-md rounded-3xl border-2 border-safe bg-white shadow-2xl shadow-safe/20 overflow-hidden text-left">
    <div className="bg-navy text-white px-7 py-5 flex items-center justify-between"><span className="font-bold text-lg">Basic Starter Pack</span><span className="text-xs font-bold bg-safe text-navy rounded-full px-3 py-1">Hemat ±70%</span></div>
    <div className="p-7">
     <div className="text-sm text-slate-500">Kit Elektronika Konvensional</div>
     <div className="text-xl font-semibold text-slate-400 line-through decoration-red-500 decoration-2">Rp 500.000+</div>
     <div className="mt-1 flex items-end gap-2"><span className="text-5xl font-extrabold text-navy">Rp 149.000</span></div>
     <ul className="mt-6 space-y-3">${items.map(i => html`<li key=${i} className="flex gap-3 text-slate-700 text-sm"><span className="mt-0.5 w-5 h-5 shrink-0 rounded-full bg-safe-soft text-safe-dark flex items-center justify-center"><${Icon} n="check" size=${13}/></span>${i}</li>`)}</ul>
     ${!open ? html`<button onClick=${() => setOpen(true)} className="mt-8 w-full bg-safe hover:bg-safe-dark text-navy font-bold py-3.5 rounded-xl shadow-lg shadow-safe/30 transition">Pre-Order Sekarang</button>` : null}
     ${open && !done ? html`<div className="mt-8 space-y-3">
      <input className=${inp} placeholder="Nama lengkap" value=${f.nama} onChange=${e => setF({ ...f, nama: e.target.value })}/>
      <input className=${inp} placeholder="Nomor WhatsApp" value=${f.wa} onChange=${e => setF({ ...f, wa: e.target.value })}/>
      <input className=${inp} type="number" min="1" placeholder="Jumlah" value=${f.qty} onChange=${e => setF({ ...f, qty: e.target.value })}/>
      ${err ? html`<div className="text-sm text-red-600">Nama dan nomor WhatsApp wajib diisi.</div>` : null}
      <button onClick=${submit} className="w-full bg-navy hover:bg-navy-700 text-white font-bold py-3.5 rounded-xl transition">Kirim Pre-Order · Rp ${(149000 * (Number(f.qty) || 1)).toLocaleString('id-ID')}</button>
     </div>`: null}
     ${done ? html`<div className="mt-8 rounded-xl bg-safe-soft border border-safe p-4 text-center"><div className="font-bold text-safe-dark">Terima kasih, ${f.nama}!</div><div className="text-sm text-slate-600 mt-1">Pre-order tercatat (simulasi mockup). Tim kami akan menghubungi via WhatsApp.</div></div>` : null}
    </div>
   </div>
  </div>
 </section>`;
    }

    function Gallery() {
      const g = [['flatlay', 'Foto Produk Utuh', 'Flat lay seluruh isi paket'], ['modul', 'Modul Self-Diagnose', 'Close-up LED & tombol'], ['jst', 'Konektor JST Asimetris', 'Close-up soket & kabel'], ['guidebook', 'Hybrid Guidebook', 'Halaman skematik + QR']];
      return html`<section id="produk" className="py-20 px-5 bg-white"><div className="max-w-6xl mx-auto">
  <div className="text-center max-w-2xl mx-auto"><h2 className="text-3xl sm:text-4xl font-extrabold text-navy">Lihat Isi Kitnya</h2><p className="mt-3 text-slate-600">Setiap bagian dirancang untuk satu tujuan: membuat belajar terasa aman.</p></div>
  <div className="mt-10 grid grid-cols-2 lg:grid-cols-4 gap-4">${g.map(([k, l, h]) => html`<div key=${k} className="aspect-[4/5]"><${Slot} k=${k} label=${l} hint=${h}/></div>`)}</div>
 </div></section>`;
    }

    function How({ onOpenModal, onOpenConnectorModal }) {
      const s = [
        { n: 'book', t: 'Rakit Sesuai Guidebook', d: 'Ikuti skematik di kiri dan visual 3D di kanan. Tidak perlu menebak.' },
        { n: 'plug', t: 'Sambungkan Konektor JST', d: 'Bentuk asimetris hanya mengizinkan satu arah. Salah colok jadi mustahil.' },
        { n: 'shield', t: 'Tekan Pre-Flight Check', d: 'Modul memeriksa rangkaian sebelum daya dialirkan ke komponen.' },
        { n: 'zap', t: 'Nyalakan & Belajar', d: 'LED hijau: daya mengalir. LED merah: arus diblokir, perbaiki lalu ulangi.' }
      ];
      return html`<section id="cara" className="py-20 px-5 bg-[#F5F8FB]"><div className="max-w-6xl mx-auto">
  <div className="text-center max-w-2xl mx-auto"><h2 className="text-3xl sm:text-4xl font-extrabold text-navy">Cara Kerja: 4 Langkah Aman</h2><p className="mt-3 text-slate-600">Dari kotak sampai LED menyala, tanpa rasa was-was.</p></div>
  <div className="mt-14 grid sm:grid-cols-2 lg:grid-cols-4 gap-6">${s.map((x, i) => html`<div key=${i} className="relative bg-white rounded-2xl p-6 pt-8 border border-slate-200 hover:border-safe hover:shadow-lg transition">
   <span className="absolute -top-4 left-6 w-9 h-9 rounded-full bg-navy text-white font-bold flex items-center justify-center ring-4 ring-[#F5F8FB]">${i + 1}</span>
   <div className="w-12 h-12 rounded-xl bg-safe-soft text-safe-dark flex items-center justify-center"><${Icon} n=${x.n} size=${24}/></div>
   <h3 className="mt-4 text-lg font-bold text-navy">${x.t}</h3><p className="mt-2 text-sm text-slate-600 leading-relaxed">${x.d}</p></div>`)}</div>
  <div className="mt-10 flex flex-wrap justify-center gap-3">
    <button onClick=${onOpenConnectorModal} className="inline-flex items-center gap-2 bg-navy hover:bg-navy-700 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg border border-cyan-400/30">
      <${Icon} n="plug" size=${18} className="text-cyan-400"/> Coba Simulasi Konektor JST 3D
    </button>
    <button onClick=${onOpenModal} className="inline-flex items-center gap-2 bg-navy hover:bg-navy-700 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg">
      <${Icon} n="cube" size=${18} className="text-safe"/> Coba Simulasi Pre-Flight Check 3D
    </button>
  </div>
 </div></section>`;
    }

    function Qr() {
      if (IMAGES.qr) return html`<img src=${IMAGES.qr} alt="QR tutorial" className="w-24 h-24"/>`;
      const c = [];
      for (let i = 0; i < 11; i++)for (let j = 0; j < 11; j++) {
        const fin = (i < 3 && j < 3) || (i < 3 && j > 7) || (i > 7 && j < 3);
        const on = fin ? !((i === 1 && j === 1) || (i === 1 && j === 9) || (i === 9 && j === 1)) : ((i * 7 + j * 13 + i * j) % 3 === 0);
        c.push(html`<div key=${i * 11 + j} className=${on ? 'bg-navy' : 'bg-white'}></div>`);
      }
      return html`<div className="grid grid-cols-[repeat(11,1fr)] grid-rows-[repeat(11,1fr)] w-24 h-24 p-1.5 bg-white border-2 border-navy rounded">${c}</div>`;
    }

    function Guidebook() {
      const [scan, setScan] = useState(false);
      const [playing, setPlaying] = useState(false);
      const [p, setP] = useState(0);
      useEffect(() => { if (!playing) return; const id = setInterval(() => setP(v => { if (v >= 100) { setPlaying(false); return 100; } return v + 2; }), 120); return () => clearInterval(id); }, [playing]);
      const steps = ['Siapkan komponen', 'Pasang konektor JST', 'Hubungkan LED', 'Pre-Flight Check'];
      const act = Math.min(3, Math.floor(p / 25));
      const toggle = () => { if (p >= 100) setP(0); setPlaying(!playing); };
      return html`<section id="guidebook" className="py-20 px-5 bg-white"><div className="max-w-5xl mx-auto">
  <div className="text-center max-w-2xl mx-auto"><h2 className="text-3xl sm:text-4xl font-extrabold text-navy">Contoh Hybrid Guidebook</h2><p className="mt-3 text-slate-600">Kiri untuk memahami, kanan untuk merakit. Satu QR membawa Anda ke video tutorial.</p></div>
  <div className="mt-12 rounded-3xl shadow-2xl border border-slate-200 overflow-hidden grid md:grid-cols-2 bg-[#FFFDF7] text-navy">
   <div className="p-6 sm:p-8 md:border-r md:border-slate-300" style=${{ boxShadow: 'inset -14px 0 18px -16px rgba(0,0,0,.3)' }}>
    <div className="flex justify-between text-xs font-semibold text-slate-500"><span>PROYEK 1 · LED PERTAMAMU</span><span>Hal. 12</span></div>
    <h3 className="mt-3 text-xl font-bold">Skematik Dasar</h3>
    <svg viewBox="0 0 220 130" className="mt-3 w-full" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
     <path d="M30 20H70M110 20H190V45M190 70V110H30V60M30 20V50"/><rect x="70" y="12" width="40" height="16" rx="2"/>
     <path d="M178 45H202L190 70Z M178 70H202 M20 50H40 M25 60H35"/>
     <text x="34" y="14" fontSize="10" fill="currentColor" stroke="none">+5V</text><text x="72" y="44" fontSize="10" fill="currentColor" stroke="none">R 220Ω</text><text x="204" y="62" fontSize="10" fill="currentColor" stroke="none">LED</text><text x="40" y="126" fontSize="10" fill="currentColor" stroke="none">GND</text>
    </svg>
    <p className="mt-2 text-sm text-slate-600">Arus mengalir dari +5V melewati resistor, menyalakan LED, lalu kembali ke GND.</p>
   </div>
   <div className="p-6 sm:p-8 border-t md:border-t-0 border-slate-300">
    <div className="flex justify-between text-xs font-semibold text-slate-500"><span>PERAKITAN</span><span>Hal. 13</span></div>
    <h3 className="mt-3 text-xl font-bold">Visual Perakitan 3D</h3>
    <div className="h-40 flex items-center justify-center" style=${{ perspective: '700px' }}>
     <div className="relative w-40 h-28 rounded-lg bg-navy shadow-xl" style=${{ transform: 'rotateX(55deg) rotateZ(-32deg)' }}>
      <div className="absolute left-3 top-3 w-10 h-6 rounded bg-navy-500 border border-white/30"></div><div className="absolute left-16 top-3 w-12 h-8 rounded bg-safe/80"></div>
      <div className="absolute left-4 bottom-5 w-14 h-3 rounded bg-amber-300"></div><div className="absolute right-4 bottom-4 w-5 h-5 rounded-full bg-safe shadow-lg"></div>
     </div>
    </div>
    <p className="text-xs text-slate-500 text-center">① Konektor JST · ② Modul · ③ Resistor · ④ LED</p>
    <div className="mt-5 flex items-center gap-4 rounded-2xl bg-white border border-slate-200 p-4">
     <${Qr}/>
     <div><div className="font-bold text-sm">Pindai untuk video tutorial</div><div className="text-xs text-slate-500 mt-1">Proyek 1: LED Pertamamu</div>
      <button onClick=${() => setScan(true)} className="mt-3 inline-flex items-center gap-2 bg-navy hover:bg-navy-700 text-white text-xs font-semibold px-3 py-2 rounded-lg transition"><${Icon} n="scan" size=${14}/>Pindai QR (simulasi)</button></div>
    </div>
   </div>
  </div>
  <div className="mt-10 flex justify-center">
   ${!scan ? html`<p className="text-sm text-slate-500">Tekan “Pindai QR” untuk melihat tampilan tutorial di ponsel.</p>` : html`<div className="w-60 rounded-[2rem] border-8 border-navy bg-white shadow-2xl overflow-hidden text-navy">
    <div className="bg-navy h-32 flex items-center justify-center"><button onClick=${toggle} className="w-14 h-14 rounded-full bg-white/10 border border-safe flex items-center justify-center gap-1.5">${playing ? html`<span className="w-1.5 h-5 bg-safe rounded-sm"></span><span className="w-1.5 h-5 bg-safe rounded-sm"></span>` : html`<span style=${{ borderLeft: '16px solid #16C47F', borderTop: '10px solid transparent', borderBottom: '10px solid transparent', marginLeft: '4px' }}></span>`}</button></div>
    <div className="h-1.5 bg-slate-200"><div className="h-full bg-safe transition-all" style=${{ width: p + '%' }}></div></div>
    <div className="p-4"><div className="font-bold text-sm">LED Pertamamu</div><ul className="mt-3 space-y-2">${steps.map((t, i) => html`<li key=${i} className=${'flex items-center gap-2 text-xs ' + (i <= act && p > 0 ? 'text-navy font-semibold' : 'text-slate-400')}><span className=${'w-4 h-4 rounded-full text-[9px] flex items-center justify-center ' + (i <= act && p > 0 ? 'bg-safe text-navy' : 'bg-slate-200')}>${i + 1}</span>${t}</li>`)}</ul></div>
   </div>`}
  </div>
 </div></section>`;
    }

    function App() {
      const [modalOpen, setModalOpen] = useState(false);
      const [connectorModalOpen, setConnectorModalOpen] = useState(false);

      return html`
        <main>
          <${Hero} 
            onOpenModal=${() => setModalOpen(true)}
            onOpenConnectorModal=${() => setConnectorModalOpen(true)}
          />
          <${Features}
            onOpenModal=${() => setModalOpen(true)}
            onOpenConnectorModal=${() => setConnectorModalOpen(true)}
          />
          <${Gallery}/>
          <${How} 
            onOpenModal=${() => setModalOpen(true)}
            onOpenConnectorModal=${() => setConnectorModalOpen(true)}
          />
          <${Guidebook}/>
          <${Pricing}/>
          <${SimulationModal} isOpen=${modalOpen} onClose=${() => setModalOpen(false)}/>
          <${ConnectorModal} isOpen=${connectorModalOpen} onClose=${() => setConnectorModalOpen(false)}/>
          <footer className="bg-navy text-slate-400 text-sm text-center py-8 px-5">EDU-BOARD · Prototipe web landing page · Tim 9 Technopreneurship.</footer>
        </main>
      `;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
  </script>
</body>

</html>
